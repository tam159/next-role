table_name: user_activity
main_dttm_col: null
description: Per-user activity + estimated LLM spend.
default_endpoint: null
offset: 0
cache_timeout: null
schema: nextrole_marts
catalog: null
sql: "SELECT u.user_id, u.name, u.email_domain,\n       coalesce(r.runs, 0) AS runs,\n       coalesce(r.threads, 0) AS threads,\n       m.total_tokens AS total_tokens,\n       m.est_cost_usd AS est_cost_usd\nFROM nextrole_marts.dim_user AS u\nLEFT JOIN (SELECT owner, count() AS runs, countDistinct(thread_id) AS threads\n           FROM nextrole_marts.fct_run GROUP BY owner) AS r ON r.owner = u.user_id\nLEFT JOIN (SELECT owner, sum(total_tokens) AS total_tokens, sum(est_cost_usd) AS est_cost_usd\n           FROM nextrole_marts.fct_message GROUP BY owner) AS m ON m.owner = u.user_id"
