# NextRole analytics dbt project — bronze (dlt) → staging views → gold marts.
# dbt-clickhouse maps `schema` to a ClickHouse database, so with the profile
# schema `nextrole` the custom schemas land in `nextrole_staging` /
# `nextrole_marts` (auto-created).
name: nextrole_analytics
version: "1.0.0"
profile: nextrole_clickhouse

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

models:
  nextrole_analytics:
    staging:
      +schema: staging
      +materialized: view
      # Relation comments only: ClickHouse views reject `COMMENT COLUMN`, so
      # asking for column docs here fails the build. The one MergeTree model in
      # this layer opts into columns itself.
      +persist_docs:
        relation: true
    marts:
      +schema: marts
      +materialized: table
      # Write the column dictionary into ClickHouse itself, so `DESCRIBE` and
      # `system.columns` carry the same prose as the dbt docs. The analytics
      # agent reads both, and this keeps it answerable when dbt-docs is down.
      +persist_docs:
        relation: true
        columns: true

seeds:
  nextrole_analytics:
    +schema: marts
